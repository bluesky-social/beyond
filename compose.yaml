name: beyond

services:
  postgres:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: beyond
      POSTGRES_PASSWORD: beyond
      POSTGRES_DB: beyond
      PGPORT: ${BEYOND_POSTGRES_PORT:-31946}
    ports:
      - "${BEYOND_POSTGRES_PORT:-31946}:${BEYOND_POSTGRES_PORT:-31946}"
    volumes:
      - ./dev/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyond -p ${BEYOND_POSTGRES_PORT:-31946}"]
      interval: 2s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.12-alpine@sha256:7d93fb39bb2bfc8509bd621241db974e41041ac0ae626a5b06e172431fc709f7
    environment:
      CLICKHOUSE_DB: beyond
      CLICKHOUSE_USER: beyond
      CLICKHOUSE_PASSWORD: beyond
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${BEYOND_CLICKHOUSE_NATIVE_PORT:-31947}:9000"
      - "${BEYOND_CLICKHOUSE_HTTP_PORT:-31948}:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "beyond", "--password", "beyond", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.0
    command: server
    ports:
      - "9000:9000"
    environment:
      AUTHENTIK_SECRET_KEY: dev-secret-key-not-for-production
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: ${BEYOND_POSTGRES_PORT:-31946}
      AUTHENTIK_POSTGRESQL__USER: beyond
      AUTHENTIK_POSTGRESQL__PASSWORD: beyond
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@beyond.local
      AUTHENTIK_LOG_LEVEL: warning
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.0
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: dev-secret-key-not-for-production
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: ${BEYOND_POSTGRES_PORT:-31946}
      AUTHENTIK_POSTGRESQL__USER: beyond
      AUTHENTIK_POSTGRESQL__PASSWORD: beyond
      AUTHENTIK_POSTGRESQL__NAME: authentik
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  echo:
    image: ealen/echo-server:0.9.2@sha256:006b92e1d6682442e29d1d0d73c34a61166d42f8a5bf1ea10c318f07ad4790e2
    ports:
      - "18080:18080"
    environment:
      PORT: "18080"

networks:
  default:
    ipam:
      config:
        # Keep the dev bridge out of Tailscale/site-routed ranges. Docker's
        # automatic 172.20.0.0/16 allocation can be stolen by policy routing,
        # which makes published localhost ports accept TCP and then blackhole.
        - subnet: ${BEYOND_DOCKER_SUBNET:-172.31.251.0/24}
