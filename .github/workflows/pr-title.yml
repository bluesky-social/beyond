name: pr-title

# PR titles become squash-merge commit messages, and release-please drops any
# commit without a `type:` prefix. The org reusable workflow makes the prefix a
# required check (bluesky-social/.github .github/workflows/pr-title.yml).
#
# Required check: `pr-title / pr-title`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    uses: bluesky-social/.github/.github/workflows/pr-title.yml@v1
