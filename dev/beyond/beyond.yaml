sessions:
  http_lifetime: 12h

portal:
  host: localhost
  title: Applications

admin_groups:
  - "authentik Admins"

applications:
  # The route name is the Authentik application slug. `just up` creates an
  # `echo` application bound to engineering, so with the Authentik API
  # configured (.env) its bindings govern this route and allowed_groups is
  # ignored; allowed_groups applies only when no such application exists.
  echo:
    upstream: http://localhost:18080
    host: echo.localhost
    display_name: Echo
    description: Inspect requests forwarded through Beyond.
    launch_url: https://echo.localhost:8443/
    allowed_groups: [engineering]
